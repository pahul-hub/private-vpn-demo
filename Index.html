<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private App Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;

            border-top: 5px solid #ff9900; /* AWS Orange */
        }
        h1 {
            color: #232f3e; /* AWS Dark Blue */
        }
        .success-text {
            color: #2e7d32;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World Private VPN Demo</h1>
        <p>Welcome to the Palladium Security internal testing environment.</p>
        <p class="success-text">✅ If you are seeing this page, your Google Secure Gateway and AWS Site-to-Site VPN are routing traffic successfully!</p>
    </div>

</html>
